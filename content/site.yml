home:
  intro: |
    We are a research group in the Discipline of Earth Sciences at IIT Gandhinagar, led by Utsav Mannu. The group started in November 2021. It has PhD and MTech students, a visiting scholar and summer interns, and has had two postdocs.

    Our work has two strands. On the geodynamics side we write and run numerical models of how the solid Earth deforms over millions of years: accretionary wedges and forearc basins at subduction zones, rifts and plumes on the Indian margins, and the minerals of the deep mantle. On the earthquake side we work with recorded ground motion and earthquake catalogues: ground-motion models for the Himalaya, stochastic simulation of shaking, earthquake clustering, site response and seismic hazard for critical facilities.

    We sit in Academic Block 12 on the IITGN campus at Palaj, Gandhinagar, and run our models on the institute's PARAM Ananta supercomputer. If you want to work with us, the [Join us](/join/) page says how.
  news_count: 5
  pubs_count: 5
contact_text: |
  Utsav Mannu's office is Room 406-B in Academic Block 12 (AB 12) on the IIT Gandhinagar campus at Palaj, Gandhinagar. Email is the best way to reach us. The campus is on the Sabarmati, across the river from Gandhinagar and about 30 km from Ahmedabad; IITGN's [campus site](https://campus.iitgn.ac.in/) and [contact page](https://iitgn.ac.in/contact) have the institute's address and general numbers. If you are visiting, write ahead and we will meet you at AB 12.
