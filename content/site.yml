contact_text: |
  Utsav Mannu's office is Room 406-B in Academic Block 12 (AB 12) on the IIT Gandhinagar campus at Palaj, Gandhinagar. Email is the best way to reach us. The campus is on the Sabarmati, across the river from Gandhinagar, about 30 km from Ahmedabad railway station and 22 km from the airport; IITGN's [route map](https://campus.iitgn.ac.in/pdf/Reaching%20IITGN.pdf), [campus site](https://campus.iitgn.ac.in/) and [contact page](https://iitgn.ac.in/contact) have the directions, the institute's address and general numbers. If you are visiting, write ahead and we will meet you at AB 12.
