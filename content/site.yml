page_intros:
  research: |
    Five themes, each with the people who work on it and the papers that came out of it. Most of what we do runs on code we write ourselves or on open geodynamic codes, with field data where we can get it. The figures are our own model outputs, maps and posters, or figures from our open-access papers, each credited.
  people: |
    The group now, and those who have passed through it. Institutional email addresses are listed where we have one on record. Some photographs are from the Earth Sciences department site.
  publications: |
    Journal papers, conference papers, theses and datasets from the group, newest first. Names in bold are group members, past and present. The open access mark means the publisher's version is free to read. Conference abstracts are in a collapsed list at the end of each year.
  news: |
    Papers out, defences, awards, talks, new instruments and the odd workshop, newest first.
  awards: |
    Awards, fellowships and prizes received by members of the group, and the PI's earlier ones, newest first.
  teaching: |
    Courses Utsav Mannu teaches at IITGN, mostly in the Discipline of Earth Sciences. The [IITGN course catalogue](https://iitgn.ac.in/academics/courses) has the official contents and credits; the links below go to the course outlines on the department site.
  projects: |
    Funded projects and fellowships held in the group. Industry-sponsored work is listed on one line without client names.
