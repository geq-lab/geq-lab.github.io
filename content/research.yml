- id: rifts
  title: Rifts, plumes and the Indian margins
  summary: 'The margins of India record rifting, plume volcanism and, in the Andaman Sea, oblique subduction, and we model all three. For the Cambay rift basin in Gujarat we run 2D thermo-mechanical models of rifting followed by inversion, coupled to the FastScape surface-process code, to see which histories fit the structure we observe. Shravan Kumar began this work as a postdoc with us, with forward gravity models across the basin, and Sumit Singh now carries the models. Sumit is also adding fracture mechanics to geodynamic models through a phase-field approach, so that faults and earthquakes emerge inside a long-term tectonic model. For the Kerguelen plume we run I2VIS with a plume under a moving plate, with mantle melting and melt extraction. In the Andaman arc, Jagroop Singh runs 3D LaMEM models of oblique subduction, slab tearing and back-arc rifting and tests them against gravity. Parvee reconstructs the Cenozoic evolution of the Andaman forearc basin from seismic reflection profiles
    and offshore wells, and Devanarayanan E M interprets the same seismic lines for his MTech thesis, with Pankaj Khanna. Earlier work with Ramendra Sahoo and Pankaj Khanna covered the Holocene reefs and shallow marine carbonates of South Andaman.

    '
  image: img/cambay_rift_setting.jpg
  image_alt: Topographic map of western India with the Kachchh, Cambay and Narmada rifts labelled KR, CR and NR, the Saurashtra block, the Deccan Volcanic Province and the Aravalli-Delhi fold belt, and modelled profile lines
  image_caption: Topography of western India with the Kachchh (KR), Cambay (CR) and Narmada (NR) rifts, Saurashtra (SCB), the Deccan Volcanic Province (DVP) and the Aravalli-Delhi fold belt (ADFB)
  image_credit: Shravan Kumar, Geodynamics & Earthquake Lab, from public topographic data
