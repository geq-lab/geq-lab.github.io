- id: deep
  title: Deep Earth mineral physics and Earth observation
  summary: 'Two smaller strands sit here. The first is computational mineral physics. Density functional theory (DFT) calculations tell us how minerals behave at the pressures and temperatures of the deep Earth. Gulshan Kumar works on the rutile to CaCl2-type transition in GeO2, a low-pressure analogue of SiO2, its elastic constants and seismic velocities, and how the transition would appear in subducting slabs of different ages. Sumit Ghosh combines DFT with Raman spectroscopy for oxides and silicate minerals, with a published equation of state of GeO2 to 70 GPa and conference work on euclase under pressure. Deoyani Shelke, whose PhD proposal was on the phase stability of (Pb,Zn)S solid solutions, now studies the phase transitions of cobalt phosphide, Co2P, a model for the light-element alloys of planetary cores, combining DFT with diamond anvil cell and Raman measurements made during an exchange semester at Kumamoto University. These calculations run on PARAM Ananta, the supercomputer
    at IITGN. The second strand is Earth observation. Meghdatt Thakkar is starting on coseismic ground deformation measured with Sentinel-1 radar interferometry (InSAR). Vansangkimi, a visiting PhD scholar from Mizoram University, reads the uplift history of the Indo-Burma Ranges from river profiles, chi and channel steepness, knickpoints and drainage divide migration, converts it to rates with river sediment loads, and maps landslide susceptibility.

    '
