      caption: Calculated magnetic moment of Co2P against pressure for its two crystal structures, showing the loss of magnetism under compression, from a manuscript in preparation
      credit: Deoyani Shelke, Geodynamics & Earthquake Lab
    - image: img/znpbs_structure.png
      alt: Ball-and-stick model of a lead-zinc sulphide crystal with large red lead atoms, grey zinc atoms and yellow sulphur atoms
      caption: Model of a lead-zinc sulphide solid solution from Deoyani Shelke's PhD proposal on the phase stability of (Pb,Zn)S
      credit: Deoyani Shelke, Geodynamics & Earthquake Lab
