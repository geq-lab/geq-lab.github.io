- id: statseis
  title: Statistical seismology and ground motion
  summary: 'Earthquake catalogues and strong-motion records are the raw material here. Omkar works on stochastic finite-fault simulation of ground motion, how the stress parameter and the sub-fault size should be chosen, how SMSIM, EXSIM and GMSS2.0 compare on the same earthquakes, and how clustering in a catalogue should be handled, using ETAS models and a ranking of declustering methods, since the declustering choice feeds straight into the design ground motion. Shikha Sharma''s PhD built ground-motion models for the Himalaya with Sanjay Bora, starting from an evaluation of the existing models and moving on to a referenced empirical adjustment of global models to Indian data. On the way she compiled a flat file of strong-motion intensity measures for crustal earthquakes in the Indian region, published in Seismica with open data. Lalramnunkimi measured the kappa attenuation parameter across North-East India for her Master''s dissertation, with the waveforms released as a dataset. Dakshata
    Bhamare''s MTech thesis fitted ETAS models to three subduction zones. Kalpesh Soni and Deepak Choudhary are starting MTech theses in this area. We work closely with Sanjay Bora (Earth Sciences New Zealand) and Shyam Nandan (IIT Kanpur).

    '
  image: img/flatfile_station_map.png
  image_alt: Shaded-relief map of the Himalaya and northern India with earthquake epicentres as orange circles sized by magnitude, stations as red triangles and major cities marked
  image_caption: Earthquakes and strong-motion stations behind the Indian flat file, records from 1986 to 2018
  image_credit: Figure 1 of Sharma et al. (2025), Seismica, CC BY 4.0
  images:
