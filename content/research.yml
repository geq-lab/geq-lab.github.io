- id: hazard
  title: Seismic hazard, site response and monitoring
  summary: 'The hazard work takes the ground-motion science to particular sites. Virat Upadhyay is testing whether the curvature of the ground surface can stand in for the usual site-amplification proxies, computing frequency-scaled curvature from high-resolution elevation models at about 1,800 NGA-West2 and NGA-Sub stations and comparing it with ground-motion model residuals. He is also building a probabilistic hazard framework that brings geology, topography and coseismic landslides in together, the subject of his NIDM Doctoral Fellowship. Kalpesh Soni is looking at how an earthquake clustering model can guide where to put the stations of an early-warning and monitoring network, scoring layouts for warning time, blind zone and catalogue completeness. We run a Raspberry Shake seismograph for field vibration monitoring and a proton magnetometer for ground surveys. A good part of the group''s applied work is sponsored site evaluation and ground-motion studies for critical facilities under
    the national siting codes, which means regional geology and seismotectonics, deterministic and probabilistic seismic hazard, and the design-basis ground motion for a site, with gravity, magnetic and GPS surveys in the field where they are needed.

    '
  people:
  - virat-upadhyay
  - kalpesh-soni
  - utsav-mannu
