  degree: BS-MS (physics major), IISER Pune, 2021
  topic: 2D coupled thermomechanical and petrological models of what sets the style of subduction and the deformation above the slab, including back-arc extension
  now: holds a PhD from the University of Sheffield (2026) on solar flare forecasting, done as a Marie Skłodowska-Curie fellow of the SWATNet network from 2021
  links:
    orcid: "https://orcid.org/0000-0002-1367-8326"
    github: "https://github.com/shreeyesh-biswal"
  about: |
    Shreeyesh Biswal did his BS-MS thesis with the group at IISER Pune, in the Department of Earth and Climate Science, and graduated in 2021. He built two-dimensional coupled thermomechanical and petrological models of subduction and ran experiments on what controls its style. The controls tested were rheological weakening by pore-fluid and melt pressure, the geothermal gradient, and the velocities of the oceanic and continental plates. The models also followed how the region above the slab deforms, and asked which parameters produce back-arc extension. The thesis, "Studying subduction using a 2D coupled thermomechanical petrological model", is in the IISER Pune repository.

    In November 2021 he joined the Solar Physics and Space Plasma Research Centre at the University of Sheffield as a Marie Skłodowska-Curie fellow of the SWATNet network. His doctoral thesis, "Three-Dimensional Solar Flare Forecasting", was completed in 2026 and is held in the repositories of both the University of Sheffield and the University of Ioannina. He is first author of a 2024 paper in The Astrophysical Journal on R-value diagnostics of X-class flares.

- slug: vrushali-sarwan
