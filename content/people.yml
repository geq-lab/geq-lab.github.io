  topic: Comparison and ranking of six catalogue-based methods for estimating the magnitude of completeness, as groundwork for earthquake forecasting
  cosupervisor: Shyam Nandan (now IIT Kanpur)
  now: PhD student, Marie Skłodowska-Curie Industrial Doctoral Network on Digital Finance, Bucharest University of Economic Studies
  links:
    linkedin: "https://www.linkedin.com/in/rahultak99"
    scholar: "https://scholar.google.com/citations?user=Qgh7cMQAAAAJ"
    website: "https://www.digital-finance-msca.com/people/rahul-tak"
  about: |
    Rahul Tak came to the group at IISER Pune in 2020 from a physics background and did his BS-MS thesis with Utsav Mannu and Shyam Nandan in the Department of Earth and Climate Science. He graduated in May 2022. The thesis, "Comparative analysis of catalog based magnitude of completeness estimation methods", takes up the step that comes before any forecast model, the magnitude above which a network records every earthquake. He scraped and assembled earthquake catalogues, then compared and ranked six catalogue-based estimators (MAXC, MBS, MBASS, EMR, GFT and the Clauset method) on constrained and unconstrained catalogues. He also looked at how completeness has changed over time as seismic networks improved. The thesis is in the IISER Pune repository.

    He worked at Deloitte as a consultant in analytics and financial risk management, and is now a PhD student in the Marie Skłodowska-Curie Industrial Doctoral Network on Digital Finance at the Bucharest University of Economic Studies, where he works on deep-learning-based automated trading systems.

