# Faculty

- slug: utsav-mannu
  name: Utsav Mannu
  role: Principal Investigator
  group: current
  title_line: "Assistant Professor, Earth Sciences (jointly with Maritime Engineering), IIT Gandhinagar"
  since: Nov 2021
  topic: Geodynamic models of subduction wedges and rifts, ground-motion models and earthquake statistics for India, high-pressure mineral physics, seismic hazard for critical facilities
  email: utsav.mannu@iitgn.ac.in
  links:
    scholar: "https://scholar.google.com/citations?user=hcisl7UAAAAJ"
    orcid: "https://orcid.org/0000-0003-2416-3958"
    website: "https://iitgn.ac.in/faculty/earths/fac-utsav"
    github: "https://github.com/geq-lab"
  bio: |
    Utsav Mannu is an Assistant Professor of Earth Sciences at IIT Gandhinagar, where he has been since November 2021, with a joint appointment in Maritime Engineering. He did an integrated BS-MS in Earth Science at IISER Kolkata (2007 to 2012), worked briefly at the National Geophysical Research Institute, and then did a PhD at ETH Zurich (2013 to 2016) on multi-scale numerical models of accretionary wedges and forearc basins. He stayed at ETH Zurich as a postdoc through 2017 and was a DST INSPIRE Faculty fellow at IISER Pune from 2018 to 2021, with a stay in 2019 at the Earthquake Research Institute, University of Tokyo, working on the Nankai accretionary wedge. His group works on thermomechanical models of subduction wedges and rifts, ground-motion models and earthquake statistics for India, high-pressure mineral physics, and seismic hazard studies for critical facilities. He coordinates the IITGN-X education outreach programme, started the department's Earth Science Lecture Series in 2024, and received the IISER Kolkata Alumni Award in 2025.
  # The person page shows the bio above the about, so the about carries only what the bio does not.
  about: |
    His own research is numerical modelling of how the lithosphere deforms, from the thermal maturity of accreted sediments to rifting on the Indian margins. At the National Geophysical Research Institute he worked on focal-mechanism inversion in the Kumaon Himalaya, and his postdoc year at ETH Zurich was on back-arc extension and seamount subduction. The group also works on ground-motion models and earthquake statistics for India, high-pressure mineral physics and seismic hazard for critical facilities. He teaches Physics of the Lithosphere, Near Surface Geophysics, Engineering Seismology and Seismic Hazard Analysis, Statistical Seismology, Computational Tools for Earth System Modeling and Statistics for Earth Sciences, and mentors a Prime Minister's Research Fellow and an NIDM Doctoral Fellow.

# PhD students

- slug: saurabh-choubey
  name: Saurabh Choubey
  role: PhD student
  group: current
  title_line: PhD student with the group at IISER Pune from August 2020, at IIT Gandhinagar since December 2021
  since: Aug 2020
  topic: How the smectite to illite reaction in subducting sediments changes the mechanics of accretionary wedges
  email: choubeysaurabh@iitgn.ac.in
  about: |
    Saurabh Choubey asks where in a subduction wedge the clay reaction runs and what it does to the strength of the wedge. He has a BSc in Physics from Banaras Hindu University and an MSc Tech in Applied Geophysics from IIT (ISM) Dhanbad. He began his PhD with Utsav Mannu at IISER Pune in August 2020 and moved with him to IIT Gandhinagar in December 2021. He defended his PhD proposal, "Investigation of Smectite-Illite phase transition and fluid flow in accretionary wedges", on 20 December 2022.

    As smectite turns to illite in the subducting sediments it releases water and changes the strength of the décollement the wedge slides on. He is working on an analytical description of where in a wedge the reaction runs and how fast, to be compared with runs of WedgeFlow, the group's wedge code, set up for the Nankai margin. He is a co-author of the group's EGU 2025 abstract on geodynamic models of accretionary wedges with the smectite to illite transformation. A paper on this, with Shyam Nandan of IIT Kanpur, is in preparation, and the thesis is being written up.

- slug: gulshan-kumar
  name: Gulshan Kumar
  role: PhD student
  group: current
  title_line: PhD student at IITGN from July 2022, first with Rajkrishna Dutta, in the group from 2025
  since: Jul 2022
  topic: Density functional theory of mantle minerals, at present the rutile to CaCl2-type transition in GeO2
  email: kumargulshan@iitgn.ac.in
  links:
    website: "https://gk16159.github.io/"
    orcid: "https://orcid.org/0009-0004-8736-062X"
    scholar: "https://scholar.google.com/citations?user=tNZsO5kAAAAJ"
    linkedin: "https://www.linkedin.com/in/gulshan-kumar-4840b1128/"
  about: |
    Gulshan Kumar does first-principles calculations of minerals at the pressures and temperatures of the deep Earth. He has a BS-MS in Physics from IISER Kolkata and joined IIT Gandhinagar as a PhD student in July 2022, at first under Rajkrishna Dutta. Utsav Mannu became his supervisor after Dutta left the institute in 2025. His proposal, "High-pressure studies of minerals", defended on 30 August 2024, was on the phase stability of PbS, ZnS and their solid solution under pressure, with density functional theory.

    His main work since then is on GeO2, a low-pressure analogue of SiO2. He has calculated the elastic constants and seismic velocities of the rutile and CaCl2-type phases and placed the transition between them. He then followed how the transition would appear along the pressure and temperature paths of cold and warm subducting slabs of different ages. He is a co-author of a 2025 Journal of Applied Physics paper on the equation of state of the two GeO2 phases to 70 GPa and of a 2024 American Mineralogist paper on a high-pressure phase transition in Mg2GeO4. He presented the GeO2 elastic properties at the EGU General Assembly 2026 in Vienna. Earlier posters covered high-temperature Raman spectroscopy of PbS (Wadia Institute of Himalayan Geology national conference, 2023) and DFT of PbS, ZnS and their solid solution (Presidency University, Kolkata, 2024). Papers on the GeO2 transition in slabs and on the PbS-ZnS system are in preparation. The calculations run on PARAM Ananta, IITGN's supercomputer.

- slug: omkar
  name: Omkar
  role: PhD student
  group: current
  title_line: "Prime Minister's Research Fellow. MTech Earth System Science, IIT Gandhinagar, 2023"
  since: Jul 2023
  topic: Stochastic ground-motion simulation, earthquake declustering and ETAS models, and seismic hazard analysis for India
  email: omkar.singh@iitgn.ac.in
  links:
    orcid: "https://orcid.org/0009-0009-4572-9448"
  about: |
    Omkar works on statistical seismology and ground-motion simulation for seismic hazard. He did an MTech in Earth System Science at IIT Gandhinagar (2021 to 2023), with a thesis on extended finite-fault simulation of ground motion with GMSS2.0, and began his PhD on 31 July 2023 as a Prime Minister's Research Fellow. He defended his proposal, "Non-Stationary Seismic Hazard Analysis", on 28 October 2024.

    The first strand of his work is stochastic finite-fault simulation: how the stress parameter, kappa and the number of sub-faults should be chosen, and how the codes SMSIM, EXSIM and GMSS2.0 compare on the same earthquakes. The comparison came out in Seismological Research Letters in 2026, with Shikha Sharma, Sanjay Singh Bora and Utsav Mannu, and a second paper, on estimating the stress parameter from response spectra, is under review. The second strand, with Shyam Nandan of IIT Kanpur, is earthquake clustering. He ranks declustering methods against ETAS simulations and asks how the choice of method affects the background rate, the b value and the hazard that follows. A paper on the spatial bias of declustering methods is in preparation, and he is now on the time-dependent side of the same problem. He has presented at the SSA Annual Meeting 2024 in Anchorage, 18WCEE in Milan, JpGU 2025 in Chiba and AES-2026 in Gandhinagar, and had an abstract at the EGU General Assembly 2026.

- slug: sumit-ghosh
  name: Sumit Ghosh
  role: PhD student
  group: current
  title_line: PhD student at IITGN from July 2023, first with Rajkrishna Dutta, supervised by Utsav Mannu from early 2026
  since: Jul 2023
  topic: Oxides and silicate minerals at high pressure, by first-principles calculations and Raman spectroscopy
  email: sumit.ghosh@iitgn.ac.in
  links:
    orcid: "https://orcid.org/0009-0004-5860-4971"
    linkedin: "https://www.linkedin.com/in/sumit-ghosh-3aa47021b"
  about: |
    Sumit Ghosh combines density functional theory with Raman spectroscopy and diamond anvil cell data to follow how oxides and silicate minerals change at high pressure and temperature. He joined IIT Gandhinagar as a PhD student in July 2023 under Rajkrishna Dutta. After Dutta left the institute in 2025, Utsav Mannu took over his guidance and became his supervisor in early 2026. He defended his proposal, "High pressure behaviour of oxides and silicate minerals", on 22 August 2025.

    His first objective is published: the equation of state of the rutile and CaCl2-type phases of GeO2 to 70 GPa, from laser-heated diamond anvil cell experiments with synchrotron X-ray diffraction and DFT calculations, in the Journal of Applied Physics (2025), with Gulshan Kumar, Sharad Babu Pillai and Rajkrishna Dutta. He also works on euclase, BeAlSiO4(OH), under pressure, combining Raman spectroscopy with first-principles calculations, which he presented at the Conference on Integrated Earth at IISER Pune (2024) and at the National Seminar on Dynamic Processes of the Earth at Presidency University, Kolkata (2025). He presented the GeO2 equation of state at the Geological Survey of India's 175-year international seminar in Jaipur in November 2025 and is a co-author of the EGU 2026 abstract on the elastic properties of GeO2 polymorphs to 120 GPa. He is now on the second objective of his thesis.

- slug: deoyani-shelke
  name: Deoyani Shelke
  role: PhD student
  group: current
  title_line: PhD student at IITGN from July 2023, first with Rajkrishna Dutta
  since: Jul 2023
  topic: Phase transitions of cobalt phosphide at high pressure, by density functional theory and diamond anvil cell data
  email: deoyani.shelke@iitgn.ac.in
  about: |
    Deoyani Shelke follows what happens to minerals and metal phosphides when they are squeezed to the pressures of planetary interiors, with density functional theory and diamond anvil cell experiments. She joined IIT Gandhinagar as a PhD student in July 2023, at first under Rajkrishna Dutta, and is now supervised by Utsav Mannu. Her first project was on the pressure-induced phase transitions of zinc sulphide and the phase stability of (Pb,Zn)S solid solutions from first principles, presented as a poster at Presidency University, Kolkata, in March 2025 and defended as her PhD proposal on 3 September 2025.

    Her main work now is cobalt phosphide, Co2P, a model for the light-element alloys thought to sit in planetary cores. She spent a six-month exchange semester at Kumamoto University, Japan, in 2025-26 under the IJEP student exchange programme, in the Department of Physics, where she ran diamond anvil cell experiments and Raman measurements on the Co2P transition. She combines those data with DFT calculations of the stability, structure and properties of the phases, run on PARAM Ananta, IITGN's supercomputer. A paper on the high-pressure behaviour of Co2P, with the Kumamoto collaborators, is in preparation. A third objective in her proposal is to build thermodynamic data for Perple_X from the calculations.

- slug: parvee
  name: Parvee
  role: PhD student
  group: current
  since: Aug 2023
  topic: Cenozoic evolution of the Andaman forearc basin from seismic reflection profiles, wells and geodynamic models
  email: parvee.23310033@iitgn.ac.in
  links:
    orcid: "https://orcid.org/0009-0004-0549-7199"
    linkedin: "https://www.linkedin.com/in/parvee-kushwaha-0984a8209"
  about: |
    Parvee reconstructs how the Andaman forearc basin, where the Indian plate subducts obliquely beneath the Burma plate, has evolved through the Cenozoic. She joined the group as a PhD student in August 2023 and defended her proposal on 25 March 2025. Her thesis theme is the role of tectonics and sedimentation in the basin.

    She interprets 2D seismic reflection profiles and offshore well data from the Directorate General of Hydrocarbons. On the sections she maps the East Margin, Diligent and West Andaman faults, the sedimentary sequences from the Paleogene onward and the channel and levee systems of the deep-water fill, and she ties the wells to the seismic lines. In 2026 she has worked on the well logs and their projection onto the seismic lines. The second part of the plan is 2D and 3D geodynamic models of the forearc under oblique subduction, to test what the seismic record says about subsidence, uplift and fault reactivation. She presented a poster on tectonics and sedimentation in the Andaman forearc basin at the Geological Survey of India's 175-year international conference in Jaipur in November 2025. She works with Devanarayanan E M, whose MTech thesis is on the same seismic lines.

- slug: virat-upadhyay
  name: Virat Upadhyay
  role: PhD student
  group: current
  title_line: NIDM Doctoral Fellow 2025-26
  since: Dec 2023
  topic: Terrain curvature as a proxy for seismic site amplification, and probabilistic seismic hazard that includes coseismic landslides
  email: virat.upadhyay@iitgn.ac.in
  cosupervisor: Pankaj Kumar, National Institute of Disaster Management
  links:
    linkedin: "https://www.linkedin.com/in/virat-upadhyay-950397232"
  about: |
    Virat Upadhyay asks whether the shape of the ground surface can show how strongly a site will shake, and how that feeds into landslide hazard. He joined the group as a PhD student in December 2023. His proposal, "Toward Integrated Probabilistic Hazard Assessment: Integrating Multivariate Geological Factors and Surface Topography", was defended on 11 August 2025. The same proposal won him the National Institute of Disaster Management's Doctoral Fellowship for 2025-26, with Pankaj Kumar of NIDM as co-supervisor.

    In the first part of the work he computes the curvature of the terrain from high-resolution digital elevation models, 1 m data at the NGA-West2 stations in the United States and about 4 m data from GSI tiles at the NGA-Sub stations in Japan. The curvature is smoothed over a range of window sizes, so that each scale picks out terrain features of a given size, and compared with the residuals of ground-motion models at those stations. A paper on surface curvature as a site-amplification proxy is in preparation. The next parts bring in geological complexity, tectonic, lithological and structural, together with seismicity, and then fold landslide susceptibility into probabilistic seismic hazard analysis. He presented the curvature work as a poster at AES-2026 in Gandhinagar in January 2026. He also designed the group's logo and takes part in the group's field surveys.

- slug: sumit-singh
  name: Sumit Singh
  role: PhD student
  group: current
  since: Jul 2024
  topic: Phase-field fracture in a visco-elasto-plastic geodynamic code, and coupled rift-inversion models of the Cambay basin
  email: singh.sumit@iitgn.ac.in
  cosupervisor: Harini Subramanian, Mechanical Engineering, IIT Gandhinagar
  links:
    orcid: "https://orcid.org/0009-0006-4520-288X"
  about: |
    Sumit Singh is putting fracture mechanics into geodynamic models, so that faults and earthquakes can emerge inside a long-term tectonic model instead of being prescribed. He joined IIT Gandhinagar as a PhD student in July 2024, co-supervised by Harini Subramanian of Mechanical Engineering. He defended his proposal, "Integrating Fracture Mechanics into Geodynamic Modelling: A Phase-Field Approach to Fractures and Earthquakes", on 23 December 2025.

    The method is an energy-based phase-field formulation, in which a smooth damage variable stands in for cracks, coupled to a visco-elasto-plastic solver on a staggered finite-difference, marker-in-cell grid of the kind used in the group's wedge code. He has built the coupled solver in MATLAB, added adaptive time stepping for damage growth, benchmarked it against a finite-element implementation in FEniCS and fixed the bugs that showed up. He presented the approach in a paper at the 7th Indian Conference on Applied Mechanics, INCAM 2026, at IIT Kanpur, and a poster on intraplate earthquakes at AES-2026 in Gandhinagar. The later objectives are a seismo-thermo-mechanical model with rate-and-state friction and fault healing that produces earthquake sequences, and a study of how convergence rate and lithospheric temperature control where earthquakes occur. Alongside this he runs the group's 2D thermo-mechanical models of rifting and inversion in the Cambay basin, coupling the FastScape surface-process code to ASPECT, continuing Shravan Kumar's work. A paper on the Cambay models is in preparation.

- slug: jagroop-singh
  name: Jagroop Singh
  role: PhD student
  group: current
  title_line: MTech Earth Science, IIT Gandhinagar, 2025
  since: Jul 2025
  topic: 3D models of oblique subduction, slab tearing and back-arc rifting in the Andaman-Nicobar region
  email: jagroop.singh@iitgn.ac.in
  links:
    linkedin: "https://www.linkedin.com/in/jagr00p-singh"
  about: |
    Jagroop Singh builds 3D thermomechanical models of oblique subduction to ask when and how back-arc rifting starts, with the Andaman Sea as the natural example. He came to IIT Gandhinagar for the MTech in Earth Science in 2023 and worked with the group from his first year. His MTech thesis, "Evidence of Slab Tearing in the Andaman Nicobar Region: A 3D Geodynamic and Forward Gravity Modeling Approach", was defended on 25 July 2025. It used the I3ELVIS code to model a subducting plate with segments of different dip and compared the gravity anomaly of the models with the observed field. He presented it at the EGU General Assembly 2025 in Vienna, with Shravan Kumar, Taras Gerya and Utsav Mannu, and a paper from that work is in preparation.

    He continued as a PhD student from July 2025 and defended his proposal, "Significance of oblique subduction in initiation and evolution of back-arc rifting: A 3D Geodynamic Modeling Study", on 30 July 2026. The PhD uses LaMEM, a 3D staggered-grid finite-difference code with a free surface. Three sets of experiments vary the obliquity of convergence, add ridges, seamounts and fracture zones to the incoming plate, and change the thickness and distribution of forearc sediment, to see what each does to extension in the overriding plate. The first reduced-size runs give self-consistent subduction and the topography of the trench and overriding plate, and getting the trench to retreat is the current task.

# MTech students

- slug: devanarayanan-em
  name: Devanarayanan E M
  role: MTech student
  group: current
  since: Jul 2024
  topic: MTech thesis on offshore seismic reflection profiles of the Andaman forearc, with Parvee and Pankaj Khanna
  email: devanarayanan.m@iitgn.ac.in
  about: |
    Devanarayanan E M is an MTech student in Earth Sciences of the 2024 batch. His thesis is the interpretation of 2D seismic reflection profiles across the Andaman forearc, the sediment-filled basin between the Andaman islands and the Western Andaman Fault that formed under the oblique subduction of the Indian plate. He works with Parvee, whose PhD covers the Cenozoic evolution of the same basin, and with Pankaj Khanna of the department, who works on the Andaman carbonates and seismic lines.

    His own part is seismic facies mapping of the North Andaman forearc basin from two of the lines, reading the depositional packages from their reflection character. His later work extends this to a third line, with the bathymetry and a cross-section of the Andaman-Nicobar subduction system as the frame. A paper on the Andaman forearc seismic lines is in preparation.

- slug: deepak-choudhary
  name: Deepak Choudhary
  role: MTech student
  group: current
  since: Aug 2026
  topic: Earthquake sequences, aftershock clustering (ETAS) and damage accumulation over repeated shaking, with the thesis question still being fixed
  email: deepakchoudhary@iitgn.ac.in
  about: |
    Deepak Choudhary joined the group in August 2026 as an MTech student in Earth Sciences. His thesis is in the statistical seismology strand. The reading so far runs in two directions. One is how earthquakes cluster in time and space, through the epidemic-type aftershock sequence (ETAS) model and the methods for estimating its spatially varying parameters. The other is how damage accumulates in buildings over a sequence of ground motions rather than a single mainshock, which changes the fragility and vulnerability models that seismic loss estimates rest on. The thesis question, still to be settled, is expected to lie where the two meet, in the shaking a site should expect from a whole earthquake sequence. He has also been out with the group on its field vibration monitoring with the Raspberry Shake seismographs.

- slug: kalpesh-soni
  name: Kalpesh Soni
  role: MTech student
  group: current
  since: Aug 2026
  topic: Design of earthquake early-warning and monitoring networks for India, scoring station layouts with earthquake statistics
  email: kalpesh@iitgn.ac.in
  about: |
    Kalpesh Soni joined the group in August 2026 as an MTech student in Earth Sciences. His thesis asks how the three-dimensional distribution of earthquake sources, in depth as well as on the map, affects the performance of an earthquake early-warning network and where its stations should go.

    The plan is a simulator that replays synthetic earthquake sequences, with clustering from an ETAS model, through candidate station layouts. Each layout is scored on warning time at named towns, blind zone, false and missed alerts, and the magnitude of completeness of the catalogue the same stations would record. Kachchh, with the Gujarat seismic network and the long aftershock sequence of the 2001 Bhuj earthquake, is the first test region, and Northeast India, with its deep intraslab earthquakes, the second. He is reading the genetic-algorithm station-siting studies, the blind-zone theory and the recent graph-network and LoRa relay approaches to early warning.

- slug: meghdatt-thakkar
  name: Meghdatt Thakkar
  role: MTech student
  group: current
  since: Aug 2026
  topic: Satellite radar interferometry (InSAR) of earthquake ground deformation from Sentinel-1 data, with the earthquake still to be chosen
  email: meghdatt@iitgn.ac.in
  about: |
    Meghdatt Thakkar joined the group in August 2026 as an MTech student in Earth Sciences. His thesis is on measuring the ground deformation of earthquakes from space with satellite radar interferometry (InSAR). Two radar images of the same ground, taken before and after an earthquake and differenced in phase, give a map of how the surface moved along the line of sight, from which the slip on the fault at depth can be inverted.

    The reading began with the first coseismic interferogram, of the 1992 Landers earthquake (Massonnet and others, 1993), and the review of two decades of satellite geodesy for active tectonics by Elliott, Walters and Wright (2016). The data will come from the free Sentinel-1 archive, with open interferogram products and open-source processing preferred, and the earthquake to study has still to be chosen. The work is a first step for the group into Earth observation, alongside the catalogue and ground-motion work it does on earthquakes.

# Visiting scholars

- slug: vansangkimi
  name: Vansangkimi
  role: Visiting scholar
  group: visiting
  title_line: PhD scholar, Department of Geology, Mizoram University (supervisor Saitluanga Sailo, Pachhunga University College), co-supervised by Utsav Mannu from 2024 and at IITGN since July 2024
  since: Jul 2024
  topic: Uplift of the Indo-Burma Ranges read from river profiles and sediment loads, and landslide susceptibility
  about: |
    Vansangkimi's thesis is on geodynamic models of the convergent wedge of the Indo-Burma Ranges, the fold-and-thrust belt that runs through Mizoram, Manipur, Nagaland and Tripura and has hardly been modelled. She registered for the PhD at Mizoram University in August 2023 and wrote to Utsav Mannu that September, and he became her co-supervisor in 2024. The objectives, set in November 2023, are convergence velocity, slab dip and wedge taper, trench sedimentation and thrust-sheet length, and the stratigraphy the models produce. She has done the computational part of the work at IITGN since July 2024, and her stay runs to September 2027.

    Her present work reads the uplift history of the ranges from their rivers. For thirteen transverse basins, from the Barak and the Kaladan to the Karnaphuli and the Naf, she maps chi, normalised channel steepness, the hypsometric integral and knickpoints on the 30 m FABDEM bare-earth elevation model with TopoToolbox in MATLAB. From these she tests which drainage divides are moving and in which direction. River-profile inversion, started with Ramendra Sahoo, turns the profiles into an uplift history, and she is collecting suspended-sediment and discharge records from Central Water Commission gauging stations on the Barak, Kaladan and Tripura rivers to express it as erosion rates. A landslide-susceptibility map of the ranges is a side product. The geodynamic models come next.

# Alumni

- slug: shikha-sharma
  name: Shikha Sharma
  role: PhD student
  group: alumni
  title_line: PhD student at IITGN from 2019, in the group from December 2021
  since: Dec 2021
  until: 2026
  degree: PhD Earth Sciences, IIT Gandhinagar, 2026
  topic: A regionally adaptable ground-motion prediction equation for the Himalaya, a hand-processed strong-motion flat file for crustal earthquakes in India, and a referenced empirical adjustment of global models
  cosupervisor: Sanjay Singh Bora (IIT Gandhinagar until 2021, then GNS Science, now Earth Sciences New Zealand)
  links:
    orcid: "https://orcid.org/0009-0009-6997-7489"
  about: |
    Shikha Sharma joined the PhD programme in Earth Sciences at IIT Gandhinagar in 2019 and moved to the group in December 2021, co-supervised by Sanjay Singh Bora. Before IITGN she did an MTech at IIT (ISM) Dhanbad, after a degree in civil engineering. Her thesis, "Development of regionally adaptable Ground Motion Prediction Equation (GMPE) for the Himalayan region", had three parts. She first compared 13 published ground-motion models for the Himalaya against the PESMOS strong-motion data (Seismological Research Letters, 2024). She then processed by hand about 778 records from 195 crustal earthquakes at 254 stations across India into a flat file of intensity measures, released with the data (Seismica, 2025). In the third part she adjusted global NGA-West models to the Indian records with a referenced empirical approach. A paper on that chapter is in preparation. She submitted the thesis in May 2025, defended it on 22 December 2025 and received the degree at the 15th Convocation on 20 June 2026.

    She also co-authored the Journal of Seismology paper on kappa in North-East India and the 2026 SRL comparison of stochastic simulation codes. She presented at AGU 2023, at SSA 2024 in Anchorage, where her poster won a Student Presentation Award, at 18WCEE in Milan, JpGU 2025 and AES-2026, where her poster took third prize, and won the Earth Sciences best poster at IITGN's PhD Research Showcase 2024.

- slug: anindita-jana
  name: Anindita Jana
  role: MTech student
  group: alumni
  since: Jul 2024
  until: May 2026
  degree: MTech Earth Science, IIT Gandhinagar, 2026
  topic: Numerical models of how convergence velocity shapes accretionary wedges, with the SiStER code, and 3D models of seamount subduction at the Nankai-Hyuga margin
  about: |
    Anindita Jana did the MTech in Earth Science at IIT Gandhinagar from July 2024 to May 2026 and wrote her thesis in the group. The thesis, "Numerical Investigation of the Effect of Convergence Velocity on the Structural Evolution of Accretionary Wedges Using the SiStER Code", tested a prediction of critical Coulomb wedge theory, that the shape of a wedge should not depend on how fast the plates converge. She ran five two-dimensional submarine wedge models in SiStER, a finite-difference elasto-visco-plastic Stokes code with Mohr-Coulomb plasticity and cohesion weakening on faults. The models were identical except for convergence velocity, three at constant rates of 0.6, 0.8 and 1.0 cm per year and two with a step up in velocity after one million years. They test whether the thrust sequence, taper and décollement depend on the convergence rate or only on the total shortening. She submitted the thesis on 18 May 2026 and defended it on 26 May 2026.

    Alongside the thesis she ran 3D thermomechanical models of seamount subduction along the Nankai-Hyuga margin with Sumit Singh and Ayumu Miyakawa (AIST, Japan). An abstract on this work was accepted for AOGS 2026 in Fukuoka.

- slug: shravan-kumar
  name: Shravan Kumar
  role: Postdoctoral fellow
  group: alumni
  title_line: PhD Geophysics, Banaras Hindu University, 2023
  since: Jan 2024
