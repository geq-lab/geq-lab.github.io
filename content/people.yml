  topic: Estimating the magnitude of completeness of earthquake catalogues and its uncertainties, with new estimators for catalogues with few events tested on synthetic catalogues
  now: Data science faculty, Itvedant Education (as of 2023)
  about: |
    Vrushali Sarwan did her BS-MS thesis with Utsav Mannu in his first year at IISER Pune, in the Department of Earth and Climate Science, and graduated in 2019 with mathematics as her major. The thesis, "Estimating the magnitude of completeness and its uncertainties", is about the lowest magnitude above which an earthquake catalogue can be trusted to record every event, a number every seismicity or hazard study needs first. She proposed catalogue-based estimators meant to work when a catalogue holds few events, built synthetic catalogues from a model of the frequency-magnitude distribution, and compared the new estimators with three existing methods on those synthetics. The work was supported by his DST INSPIRE Faculty fellowship, and the thesis is in the IISER Pune repository. She has since taught data science, at Itvedant Education as of 2023.

