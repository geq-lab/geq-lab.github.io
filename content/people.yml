  until: May 2025
  degree: MTech Earth Science, IIT Gandhinagar, 2025
  topic: ETAS models of megathrust earthquakes in the Andaman, Alaska-Aleutian and Tonga subduction zones, compared with plate age, trench sediment thickness, seafloor roughness and plate velocities
  links:
    orcid: "https://orcid.org/0009-0006-0490-5933"
  about: |
    Dakshata Bhamare did the MTech in Earth Science at IIT Gandhinagar from 2023 to 2025 and wrote her thesis in the group. The thesis, "Geological Insights into Megathrust Earthquake Dynamics through ETAS Modeling", fitted the epidemic-type aftershock sequence model to earthquakes of magnitude 4 and above from 1960 to 2024 in three subduction zones, the Andaman, Alaska-Aleutian and Tonga. She then compared the fitted parameters (background rate, productivity, the Omori and spatial decay terms and the b value) with the age of the subducting plate, trench sediment thickness, short-wavelength seafloor roughness and the convergence, subduction and divergence velocities of the plates. She submitted the thesis in April 2025 and defended it on 25 May 2025, with Omkar as her day-to-day guide. A poster from the thesis, with Omkar, Shyam Nandan and Utsav Mannu, was presented at AES-2026 at the Institute of Seismological Research, Gandhinagar, in January 2026.

- slug: lalramnunkimi
  name: Lalramnunkimi
  role: Visiting scholar
  group: alumni
  title_line: Department of Geophysics, Pachhunga University College, Mizoram University, Aizawl
  since: Jan 2024
  until: May 2024
  degree: Master's dissertation research at IITGN, 2024
  topic: The high-frequency attenuation parameter kappa from about 200 local earthquake records in North-East India, mapped with a Voronoi grouping of stations, and first author of the group's Journal of Seismology paper (2026)
  about: |
    Lalramnunkimi measured how strongly the high frequencies of seismic waves are damped across North-East India, through the attenuation parameter kappa. She came to the group for the research part of her Master's dissertation at Pachhunga University College, Aizawl. She began the project remotely in late 2023 with her teacher Lalruatpuia Tlau, working out kappa from local earthquakes recorded at three stations in Mizoram, and worked at IITGN from January to May 2024.

    The study grew into a regional one. The dataset is 199 three-component records from 115 earthquakes of magnitude 2.5 to 6.8 across North-East India, from the PESMOS strong-motion network and broadband stations in Mizoram. Kappa was measured by fitting an exponential decay to the acceleration spectra after Anderson and Hough (1984), and the stations were grouped by Voronoi cells to map how it varies with site geology. She wrote the manuscript in mid-2024 with Shikha Sharma's help and is first author of "Seismic attenuation in North-East India: estimation and analysis of the kappa parameter", published in Journal of Seismology in 2026 with Shikha Sharma, Lalruatpuia Tlau, Zosangliana Ralte, Saitluanga Sailo and Utsav Mannu. The waveform dataset behind the paper is on Figshare.

- slug: ramendra-sahoo
  name: Ramendra Sahoo
