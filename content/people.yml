# Faculty

- slug: utsav-mannu
  name: Utsav Mannu
  role: Principal Investigator
  group: current
  title_line: "Assistant Professor, Earth Sciences (jointly with Maritime Engineering), IIT Gandhinagar"
  since: Nov 2021
  topic: Geodynamic models of subduction wedges and rifts, ground-motion models and earthquake statistics for India, high-pressure mineral physics, seismic hazard for critical facilities
  email: utsav.mannu@iitgn.ac.in
  links:
    scholar: "https://scholar.google.com/citations?user=hcisl7UAAAAJ"
    orcid: "https://orcid.org/0000-0003-2416-3958"
    website: "https://iitgn.ac.in/faculty/earths/fac-utsav"
    github: "https://github.com/geq-lab"
  bio: |
    Utsav Mannu is an Assistant Professor of Earth Sciences at IIT Gandhinagar, where he has been since November 2021, with a joint appointment in Maritime Engineering. He did an integrated BS-MS in Earth Science at IISER Kolkata (2007 to 2012), worked briefly at the National Geophysical Research Institute, and then did a PhD at ETH Zurich (2013 to 2016) on multi-scale numerical models of accretionary wedges and forearc basins. He stayed at ETH Zurich as a postdoc through 2017 and was a DST INSPIRE Faculty fellow at IISER Pune from 2018 to 2021, with a stay in 2019 at the Earthquake Research Institute, University of Tokyo, working on the Nankai accretionary wedge. His group works on thermomechanical models of subduction wedges and rifts, ground-motion models and earthquake statistics for India, high-pressure mineral physics, and seismic hazard studies for critical facilities. He coordinates the IITGN-X education outreach programme, started the department's Earth Science Lecture Series in 2024, and received the IISER Kolkata Alumni Award in 2025.

