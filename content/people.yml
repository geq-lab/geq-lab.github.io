  topic: River-profile inversion and multifractal analysis of topography to read tectonic uplift from rivers and terrain, and the carbonates and tectonics of the Andaman Islands with Pankaj Khanna
  now: Scientist, Earth Process Modelling, CSIR-National Geophysical Research Institute, Hyderabad (since 2022)
  links:
    orcid: "https://orcid.org/0000-0002-6315-781X"
  about: |
    Ramendra Sahoo reads tectonic uplift from the shapes of rivers and terrain. He was a postdoctoral fellow in the group from March to November 2022, after a PhD at IIT Gandhinagar (2013 to 2020) and a postdoc at IISER Pune in 2020 and 2021. His papers from the PhD cover the fractal character of topography in the tectonically active North-West Himalaya and uplift rates read from river long profiles in Kachchh.

    In the group he worked on river-profile inversion and multifractal analysis of terrain, and on how the sampling scheme affects fluctuation analysis, which became the poster "Effect of sampling on fractal (fluctuation) analysis" with SRIP intern Amarjeet Kumar at a poster session at IITGN in September 2022. With Pankaj Khanna he worked on the Holocene reefs and shallow-marine carbonates of South Andaman, which led to the Frontiers in Marine Science paper (2024) and an SEPM 2024 abstract. He co-organised the SERB Accelerate Vigyan Karyashala on earthquake occurrence and risks held at IITGN in July 2022. He is now a Scientist in the Earth Process Modelling group at CSIR-National Geophysical Research Institute, Hyderabad, and still works with the group on the Andaman papers.

# Alumni of the group at IISER Pune (the PI's INSPIRE Faculty group, 2018 to 2021)

- slug: shreeyesh-biswal
  name: Shreeyesh Biswal
  role: BS-MS student
  group: alumni
  affiliation_then: IISER Pune
  title_line: BS-MS thesis student, Department of Earth and Climate Science, IISER Pune
