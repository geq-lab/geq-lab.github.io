# Faculty

- slug: utsav-mannu
  name: Utsav Mannu
  role: Principal Investigator
  group: current
  title_line: "Assistant Professor, Earth Sciences (jointly with Maritime Engineering), IIT Gandhinagar"
  since: 2021
  topic: Geodynamic models of subduction wedges and forearc basins, ground-motion models and earthquake statistics, seismic hazard for critical facilities
  email: utsav.mannu@iitgn.ac.in
  links:
    scholar: "https://scholar.google.com/citations?user=hcisl7UAAAAJ"
    orcid: "https://orcid.org/0000-0003-2416-3958"
    website: "https://iitgn.ac.in/faculty/earths/fac-utsav"
    github: "https://github.com/GeoD-Lab"
  bio: |
    Utsav Mannu is an Assistant Professor of Earth Sciences at IIT Gandhinagar, where he started in November 2021. He did an integrated BS-MS in Earth Science at IISER Kolkata (2012) and a PhD at ETH Zurich (2016) on multi-scale numerical modelling of accretionary wedges and forearc basins. He stayed at ETH Zurich as a postdoc until the end of 2017, was a DST INSPIRE Faculty fellow at IISER Pune from 2018 to 2021, and spent part of 2019 as visiting faculty at the Earthquake Research Institute, University of Tokyo. His work covers thermomechanical models of subduction wedges and forearc basins, ground-motion models and earthquake statistics for India, and seismic hazard studies for critical facilities. He also coordinates the IITGN-X education outreach programme.

