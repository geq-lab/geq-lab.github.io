  topic: 2D forward gravity models of crustal structure across the Cambay rift basin and 2D thermo-mechanical models of rift inversion, drawing on marine geophysics
  # `now` left out: his post after IITGN is known only from his own mails, not from a public page (SCHEMA: `now` only if public).
  about: |
    Shravan Kumar was a postdoctoral fellow in the group from January 2024 to April 2026. He has a PhD in Geophysics from Banaras Hindu University (2023), with a thesis on the crustal architecture, sedimentation and tectonics of the Arabian Basin in the north-west Indian Ocean. He came with experience in marine geophysics, gravity and magnetic methods and crustal structure modelling.

    At IITGN he worked on the Cambay rift basin in Gujarat. He built 2D forward gravity models of crustal structure across the basin from public satellite gravity data and worked with Utsav Mannu and Sumit Singh on 2D thermo-mechanical models of rifting followed by inversion. He was a co-author on Jagroop Singh's EGU 2025 abstract on slab tearing and gravity in the Andaman-Nicobar region.

